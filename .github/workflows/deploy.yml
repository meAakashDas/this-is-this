name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_snapshot:
        description: 'Force live Firestore content snapshot retrieval'
        required: false
        type: boolean
        default: true
      skip_tests:
        description: 'Skip Playwright automated verification'
        required: false
        type: boolean
        default: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # =========================================================================
  # Build Job: Compiles static site, generates exports, runs tests & uploads
  # =========================================================================
  build:
    name: Build Website & Artifact
    runs-on: ubuntu-latest
    env:
      PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY || 'AIzaSyBjYmwR6Zn4A9MCTdarlUEIodpTq0GOAHY' }}
      PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN || 'aakashdas-live.firebaseapp.com' }}
      PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID || 'aakashdas-live' }}
      PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.PUBLIC_FIREBASE_STORAGE_BUCKET || 'aakashdas-live.firebasestorage.app' }}
      PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '128286218310' }}
      PUBLIC_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID || '1:128286218310:web:962c0197ecfa1366a65247' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Playwright Browsers & Dependencies
        run: npx playwright install --with-deps chromium

      - name: Step 1 — Fetch CMS Content Snapshot
        run: node scripts/fetch-cms-snapshot.mjs

      - name: Step 2 — Generate Educational Resource Exports (PDF & DOCX)
        run: node scripts/generate-all-documents.mjs

      - name: Step 3 — Compile Static Astro Site (SSG)
        run: npx astro build

      - name: Step 4 — Run Automated Verification Tests
        if: ${{ !inputs.skip_tests }}
        run: npx playwright test tests/about.spec.ts tests/homepage.spec.ts tests/resources.spec.ts tests/resource-detail.spec.ts tests/resource-export-system.spec.ts tests/journal.spec.ts tests/admin-portal.spec.ts tests/brand-identity.spec.ts tests/dark-mode.spec.ts tests/responsive-viewports.spec.ts tests/shadcn-theme.spec.ts tests/cms-repair-verification.spec.ts

      - name: Verify Production Build Output
        run: |
          test -d ./dist || { echo "Error: ./dist output directory does not exist!"; exit 1; }
          test -f ./dist/index.html || { echo "Error: ./dist/index.html was not generated!"; exit 1; }
          test -f ./dist/CNAME || { echo "Error: ./dist/CNAME was not copied!"; exit 1; }
          echo "Production build output verified successfully ($(ls -1 ./dist | wc -l) files/directories in ./dist)."

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Package Static Build Artifact
        run: |
          tar \
            --dereference --hard-dereference \
            --directory ./dist \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            --exclude=".[^/]*" \
            .

      - name: Upload Static Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  # =========================================================================
  # Deploy Job: Runs ONLY after build succeeds, querying the completed artifact
  # =========================================================================
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (https://aakashdas.live)
        id: deployment
        uses: actions/deploy-pages@v5
